<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Inspired Home Solutions</title>
    <link rel="stylesheet" type="text/css" href="../static/css/forgot_password.css">

   
</head>

<body>

<div class="container">

    <h2>Forgot Password</h2>

    <p class="subtitle">
        Reset your Inspired Home Solutions password
    </p>


    <!-- EMAIL -->

    <div id="emailSection">

        <input
            type="email"
            id="email"
            placeholder="Enter your registered email"
            required
        >

        <button onclick="sendOTP()">
            Send OTP
        </button>

    </div>


    <!-- OTP -->

    <div id="otpSection" class="hidden">

        <input
            type="text"
            id="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
        >

        <button onclick="verifyOTP()">
            Verify OTP
        </button>

    </div>


    <!-- PASSWORD -->

    <div id="passwordSection" class="hidden">

        <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
        >

        <button onclick="resetPassword()">
            Reset Password
        </button>

    </div>


    <p id="message" class="message"></p>


    <div class="back">

        <a href="login.html">
            ← Back to Login
        </a>

    </div>

</div>


<script>

const API = "http://127.0.0.1:5000";


// ==========================================
// SEND OTP
// ==========================================

async function sendOTP() {

    const email =
        document.getElementById("email").value.trim();

    const message =
        document.getElementById("message");


    if (!email) {

        message.innerText =
            "Please enter your email.";

        return;
    }


    try {

        const response = await fetch(
            API + "/api/forgot-password",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email
                })
            }
        );


        const data = await response.json();


        if (data.success) {

            message.innerText =
                "OTP sent successfully.";

            document
                .getElementById("otpSection")
                .classList.remove("hidden");

            document
                .getElementById("emailSection")
                .classList.add("hidden");

            /*
             * TESTING ONLY
             * The OTP is returned by the backend.
             */
            alert("Your OTP is: " + data.otp);

        } else {

            message.innerText =
                data.message;
        }

    } catch (error) {

        message.innerText =
            "Cannot connect to Flask server.";

        console.error(error);
    }
}


// ==========================================
// VERIFY OTP
// ==========================================

async function verifyOTP() {

    const email =
        document.getElementById("email").value.trim();

    const otp =
        document.getElementById("otp").value.trim();

    const message =
        document.getElementById("message");


    if (!otp) {

        message.innerText =
            "Please enter the OTP.";

        return;
    }


    try {

        const response = await fetch(
            API + "/api/verify-otp",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    otp: otp
                })
            }
        );


        const data = await response.json();


        if (data.success) {

            message.innerText =
                "OTP verified successfully.";

            document
                .getElementById("otpSection")
                .classList.add("hidden");

            document
                .getElementById("passwordSection")
                .classList.remove("hidden");

        } else {

            message.innerText =
                data.message;
        }

    } catch (error) {

        message.innerText =
            "Cannot connect to Flask server.";

        console.error(error);
    }
}


// ==========================================
// RESET PASSWORD
// ==========================================

async function resetPassword() {

    const email =
        document.getElementById("email").value.trim();

    const otp =
        document.getElementById("otp").value.trim();

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");


    if (!newPassword || !confirmPassword) {

        message.innerText =
            "Please enter both passwords.";

        return;
    }


    if (newPassword !== confirmPassword) {

        message.innerText =
            "Passwords do not match.";

        return;
    }


    try {

        const response = await fetch(
            API + "/api/reset-password",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    email: email,

                    otp: otp,

                    new_password: newPassword

                })
            }
        );


        const data = await response.json();


        if (data.success) {

            message.innerText =
                "Password reset successfully!";

            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1500);

        } else {

            message.innerText =
                data.message;
        }

    } catch (error) {

        message.innerText =
            "Cannot connect to Flask server.";

        console.error(error);
    }
}

</script>
<script src="../static/js/data-fetch.js"></script>

</body>

</html>
